 services:
    api:
      build: .
      ports:
        - "127.0.0.1:8000:8000"
      environment:
        OTEL_SERVICE_NAME: otel-homelab-api
        OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      healthcheck:
        test:
          - CMD
          - python
          - -c
          - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"
        interval: 30s
        timeout: 3s
        retries: 3
        start_period: 10s

    otel-collector:
      image: otel/opentelemetry-collector:0.160.0
      command: ["--config=/etc/otelcol/config.yaml"]
      volumes:
        - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
